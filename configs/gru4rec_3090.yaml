# configs/gru4rec_3090.yaml
# Recommended GRU4Rec-ID config for AutoDL RTX 3090 24GB VRAM + 90GB RAM.

run_name: gru4rec_id
seed: 2026

default_dataset: Video_Games

paths:
  datasets_config: configs/datasets.yaml
  result_root: results
  log_root: logs

model:
  max_seq_len: 50
  hidden_size: 128
  num_layers: 1
  dropout: 0.2
  tie_output_embedding: true

train:
  epochs: 100
  # GRU4Rec is usually lighter than SASRec; 512 is safe for most datasets.
  # For Sports_and_Outdoors, start with 256 if dataloader or evaluation is slow.
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  num_workers: 4
  patience: 10
  min_delta: 0.0
  eval_every: 1
  log_every: 100
  pin_memory: true
  save_best_only: true

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: none
  warmup_epochs: 0

eval:
  batch_size: 512
  ks: [5, 10, 20, 100]
  metric_for_best: ndcg@10
  split_for_best: val
  mask_seen_items: true
  run_test_after_training: true
  run_fairness_eval: false
  save_topk_npz: true

device: cuda
