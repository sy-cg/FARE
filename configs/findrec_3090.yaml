# configs/findrec_3090.yaml
# Project-native FindRec baseline config for AutoDL RTX 3090 24GB VRAM.
#
# This runner adapts the released FindRec / Fluid-MMRec model to this project's
# processed split files and full-sort evaluator. It requires torch and mamba-ssm.
#
# Example:
#   python scripts/run_findrec.py \
#     --dataset Video_Games \
#     --config configs/findrec_3090.yaml \
#     --run_id findrec_video
#
# Smoke test:
#   python scripts/run_findrec.py \
#     --dataset Video_Games \
#     --config configs/findrec_3090.yaml \
#     --epochs 1 \
#     --batch_size 32 \
#     --eval_batch_size 64 \
#     --run_id findrec_video_smoke

run_name: findrec
seed: 2026
default_dataset: Video_Games

paths:
  datasets_config: configs/datasets.yaml
  result_root: results

model:
  max_seq_len: 50
  text_feature_file: text_features.npy
  vision_feature_file: vision_features.npy
  text_mask_file: text_mask.npy
  vision_mask_file: vision_mask.npy

id_embedding_dim: 128
num_attention_heads: 8
hidden_size: 128
dropout_prob: 0.2
loss_type: CE

bottleneck:
  dim: 256
  beta: 1.0
  weight: 0.1
  use_stein: true
  kernel_type: rbf
  bandwidth_factor: 1.0
  entropy_weight: 0.01
  adaptive_bandwidth: true
  min_bandwidth: 0.1
  max_bandwidth: 10.0
  alignment_dropout: 0.1
  layer_norm_eps: 1.0e-12
  score_hidden_ratio: 2

stein:
  kernel_type: rbf
  adaptive_bandwidth: true
  min_bandwidth: 0.1
  max_bandwidth: 10.0

mamba:
  d_state: 16
  d_conv: 4
  expand: 2
  norm_eps: 1.0e-5
  hidden_dim: 128
  num_layers: 2

feed_forward:
  d_ff: 512
  dropout: 0.2
  layer_norm_eps: 1.0e-12

attention:
  num_heads: 8
  dropout: 0.2
  use_bias: true

multimodal:
  hidden_size: 256
  projection_dropout: 0.1
  fusion_dropout: 0.1
  feature_dropout: 0.1
  alignment_hidden: 256
  alignment_dropout: 0.2
  use_bottleneck: true

expert:
  num_experts: 4
  hidden_size: 256
  output_dim: 128
  dropout: 0.2

router:
  hidden_size: 256
  dropout: 0.1

text:
  # overwritten at model construction from text_features.npy
  feature_dim: 768
  projection_dim: 256
  layer_norm_eps: 1.0e-12

image:
  # overwritten at model construction from vision_features.npy
  feature_dim: 512
  projection_dim: 256
  layer_norm_eps: 1.0e-12

feature_fusion:
  hidden_size: 256
  dropout: 0.2
  activation: gelu
  use_residual: true

train:
  epochs: 100
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip_norm: 2.0
  label_smoothing: 0.0
  num_workers: 4
  patience: 5
  min_delta: 0.0
  eval_every: 1
  log_every: 100
  pin_memory: true
  save_best_only: true

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

eval:
  batch_size: 128
  ks: [5, 10, 20, 100]
  metric_for_best: ndcg@10
  mask_seen_items: true
  run_test_after_training: true
  run_fairness_eval: true
  save_topk_npz: true

device: cuda
