# Residual-off control requested in the IPM major revision.
# The pretrained ID branch is unfrozen and optimized with the same
# validation-exposure-derived weights used by FARE.

run_name: fare_id_exposure_reweight
method_name: ExposureReweight-ID
seed: 2026
default_dataset: Video_Games

paths:
  datasets_config: configs/datasets.yaml
  result_root: results

model:
  backbone: sasrec
  max_seq_len: 50
  hidden_size: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  activation: gelu
  layer_norm_eps: 1.0e-12
  tie_output_embedding: true

fare:
  groups:
    - popularity_group
    - text_quality_group
    - vision_quality_group
    - category_proxy_group
    - brand_store_proxy_group
    - multimodal_cluster_proxy_group
  mm_score_dim: 64
  fair_dim: 128
  encoder_hidden_dim: 128
  encoder_dropout: 0.1
  use_text: true
  use_vision: true
  projection_seed: 2026
  cache_projected_features: true
  feature_chunk_size: 32768
  normalize_representations: true
  residual_score_weight: 0.0
  fair_weight_init: 0.0
  max_fair_weight: 0.0
  learnable_fair_weight: false
  fair_rec_reweight_mode: exposure
  fair_rec_reweight_weight: 0.20
  fair_rec_reweight_groups:
    - popularity_group
  fair_rec_reweight_min: 0.5
  fair_rec_reweight_max: 2.0
  fair_rec_exposure_source: reference_topk
  fair_rec_exposure_topk_path: null
  fair_rec_exposure_item_weights_path: null
  fair_rec_exposure_target: catalog
  fair_rec_exposure_k: 10
  allow_test_exposure_topk: false
  min_group_count: 5
  drop_rare_classes: true
  freeze_id_backbone: false

train:
  epochs: 100
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  num_workers: 4
  patience: 10
  min_delta: 0.0
  eval_every: 1
  log_every: 100
  pin_memory: true

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: none

eval:
  batch_size: 512
  ks: [5, 10, 20, 100]
  metric_for_best: ndcg@10
  split_for_best: val
  mask_seen_items: true
  run_test_after_training: true
  run_fairness_eval: true
  fairness_groups: all
  save_topk_npz: true

device: cuda
