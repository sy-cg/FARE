# FARE + ModalityDebias composition used in the IPM revision protocol.
# Supply the validation-selected FARE checkpoint with --init_base_checkpoint.

run_name: fare_modality_debias
method_name: FARE+ModalityDebias
base_model: fare_sasrec
freeze_base: true
seed: 2026
default_dataset: Video_Games

paths:
  datasets_config: configs/datasets.yaml
  result_root: results
  log_root: logs

model:
  max_seq_len: 50
  hidden_size: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  activation: gelu
  layer_norm_eps: 1.0e-12
  tie_output_embedding: true

fare:
  mm_score_dim: 64
  fair_dim: 128
  encoder_hidden_dim: 128
  encoder_dropout: 0.1
  use_text: true
  use_vision: true
  projection_seed: 2026
  cache_projected_features: true
  feature_chunk_size: 32768
  normalize_representations: true
  residual_score_weight: 1.0
  fair_weight_init: 0.01
  max_fair_weight: 0.10
  learnable_fair_weight: true

modality_debias:
  branch_dim: 64
  use_text: true
  use_vision: true
  branch_dropout: 0.0
  branch_loss_weight: 1.0
  alpha: 5.0
  debias_lambda: 1.0
  counterfactual_mode: paper_product
  base_counterfactual: user_mean
  cf_prob: 0.5
  rank_normalize: true
  debias_min: 0.0
  debias_max: 1.0

train:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip_norm: 5.0
  num_workers: 4
  patience: 10
  min_delta: 0.0
  eval_every: 1
  log_every: 100
  pin_memory: true
  train_on_fused: false
  use_all_prefixes: true

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

eval:
  batch_size: 512
  ks: [5, 10, 20, 100]
  metric_for_best: ndcg@10
  split_for_best: val
  mask_seen_items: true
  run_test_after_training: true
  run_fairness_eval: true
  save_topk_npz: true

device: cuda
