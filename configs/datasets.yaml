# configs/datasets.yaml
# Paths are relative to the SDR project root.

data_root: data

datasets:
  All_Beauty:
    path: data/Processed_All_Beauty
    max_seq_len: 50
    use_as_main_result: false
    note: small dataset; recommended for sanity check, appendix, and case studies

  Video_Games:
    path: data/Processed_Video_Games
    max_seq_len: 50
    use_as_main_result: true

  Musical_Instruments:
    path: data/Processed_Musical_Instruments
    max_seq_len: 50
    use_as_main_result: true

  Baby_Products:
    path: data/Processed_Baby_Products
    max_seq_len: 50
    use_as_main_result: true

  Sports_and_Outdoors:
    path: data/Processed_Sports_and_Outdoors
    max_seq_len: 50
    use_as_main_result: true
    note: include if preprocessing validation passes

  MicroLens_100K:
    path: data/Processed_MicroLens_100K
    max_seq_len: 50
    use_as_main_result: true
    platform: short_video
    interaction_behavior: video_view_sequence
    modalities: [text, vision]
    exposure_prior: platform_views.npy
    note: external non-Amazon validation dataset; use text and cover-image features only
