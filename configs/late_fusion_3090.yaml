# configs/late_fusion_3090.yaml
# Late-fusion multimodal SASRec baseline for AutoDL RTX 3090 24GB VRAM + 90GB RAM.

run_name: late_fusion_sasrec
seed: 2026

default_dataset: Video_Games

paths:
  datasets_config: configs/datasets.yaml
  result_root: results
  log_root: logs

model:
  max_seq_len: 50
  hidden_size: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  activation: gelu
  layer_norm_eps: 1.0e-12
  tie_output_embedding: true

  # Late-fusion multimodal settings.
  # Fixed projected text/vision features are used for candidate-side residual scores.
  mm_score_dim: 64
  projection_seed: 2026
  use_text: true
  use_vision: true
  cache_projected_features: true
  feature_chunk_size: 32768

  # Small modal residual weights are safer for single-domain sequential recommendation.
  text_weight_init: 0.05
  vision_weight_init: 0.05
  max_modal_weight: 0.5
  learnable_modal_weights: true
  normalize_queries: true
  modal_dropout: 0.0

  # Optional SASRec-ID checkpoint initialization.
  # Example: results/Video_Games/sasrec_id/<run_id>/best_model.pt
  init_sasrec_checkpoint: null
  freeze_id_backbone: false

train:
  epochs: 100
  # Late fusion computes extra full-sort modal scores. Start lower than pure SASRec.
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  num_workers: 4
  patience: 10
  min_delta: 0.0
  eval_every: 1
  log_every: 100
  pin_memory: true
  save_best_only: true

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: none
  warmup_epochs: 0

eval:
  batch_size: 512
  ks: [5, 10, 20, 100]
  metric_for_best: ndcg@10
  split_for_best: val
  mask_seen_items: true
  run_test_after_training: true
  run_fairness_eval: true
  save_topk_npz: true

device: cuda
