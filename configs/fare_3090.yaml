# configs/fare_3090.yaml
# FARE final configuration for AutoDL RTX 3090 24GB VRAM + 90GB RAM.
#
# FARE keeps the multimodal residual branch and uses exposure-aware
# recommendation-loss reweighting as the fairness mechanism.
#
# Entry:
#   python scripts/run_fare.py --config configs/fare_3090.yaml ...
#
# Exposure reweighting requires a reference Top-K file:
#   --fair_rec_exposure_topk_path results/<Dataset>/<baseline>/<run_id>/topk_val.npz

run_name: fare
method_name: FARE
seed: 2026

default_dataset: Video_Games

paths:
  datasets_config: configs/datasets.yaml
  result_root: results
  log_root: logs

model:
  # FARE can wrap any supported ID sequential backbone.
  backbone: sasrec
  max_seq_len: 50
  hidden_size: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  activation: gelu
  layer_norm_eps: 1.0e-12
  tie_output_embedding: true

fare:
  groups:
    - popularity_group
    - text_quality_group
    - vision_quality_group
    - category_proxy_group
    - brand_store_proxy_group
    - multimodal_cluster_proxy_group

  # Multimodal projection / residual representation.
  mm_score_dim: 64
  fair_dim: 128
  encoder_hidden_dim: 128
  encoder_dropout: 0.1

  use_text: true
  use_vision: true
  projection_seed: 2026
  cache_projected_features: true
  feature_chunk_size: 32768
  normalize_representations: true

  # Residual branch.
  # score = score_id + residual_score_weight * fair_weight * score_fair
  residual_score_weight: 1.0
  fair_weight_init: 0.01
  max_fair_weight: 0.10
  learnable_fair_weight: true

  # Exposure-aware recommendation CE reweighting.
  fair_rec_reweight_mode: exposure
  fair_rec_reweight_weight: 0.1
  fair_rec_reweight_groups:
    - popularity_group
  fair_rec_reweight_min: 0.5
  fair_rec_reweight_max: 2.0
  fair_rec_exposure_topk_path: null
  fair_rec_exposure_source: reference_topk
  fair_rec_exposure_item_weights_path: null
  fair_rec_exposure_target: catalog
  fair_rec_exposure_k: 10
  allow_test_exposure_topk: false

  # Group labels are still loaded for exposure reweighting and fairness audits.
  min_group_count: 5
  drop_rare_classes: true
  freeze_id_backbone: true

train:
  epochs: 100
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  num_workers: 4
  patience: 10
  min_delta: 0.0
  eval_every: 1
  log_every: 100
  pin_memory: true
  save_best_only: true

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: none
  warmup_epochs: 0

eval:
  batch_size: 512
  ks: [5, 10, 20, 100]
  metric_for_best: ndcg@10
  split_for_best: val
  mask_seen_items: true
  run_test_after_training: true
  run_fairness_eval: true
  fairness_groups: all
  save_topk_npz: true

device: cuda
