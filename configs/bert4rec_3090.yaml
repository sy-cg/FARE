# configs/bert4rec_3090.yaml
# Recommended BERT4Rec-style ID config for AutoDL RTX 3090 24GB VRAM + 90GB RAM.
#
# Note:
# This config is for the project-compatible next-item full-sort version in
# src/model_bert4rec.py, not the original masked-item-prediction objective.

run_name: bert4rec_id
seed: 2026

default_dataset: Video_Games

paths:
  datasets_config: configs/datasets.yaml
  result_root: results
  log_root: logs

model:
  max_seq_len: 50
  hidden_size: 128
  num_layers: 2
  num_heads: 2
  dropout: 0.2
  activation: gelu
  layer_norm_eps: 1.0e-12
  tie_output_embedding: true
  # false = use final non-padding item hidden state.
  # true = use learned CLS state. Keep false for next-item prediction.
  use_cls_token: false

train:
  epochs: 100
  # BERT4Rec-style encoder is heavier than GRU4Rec.
  # 256 is a safer default for Baby/Sports. Try 512 on Video/Musical if stable.
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  label_smoothing: 0.0
  grad_clip_norm: 5.0
  num_workers: 4
  patience: 10
  min_delta: 0.0
  eval_every: 1
  log_every: 100
  pin_memory: true
  save_best_only: true

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: none
  warmup_epochs: 0

eval:
  batch_size: 512
  ks: [5, 10, 20, 100]
  metric_for_best: ndcg@10
  split_for_best: val
  mask_seen_items: true
  run_test_after_training: true
  run_fairness_eval: false
  save_topk_npz: true

device: cuda
